<style>
/* ============================================================
   Prism — API Explorer view (v-api- prefixed styles only)
   ============================================================ */
.v-api-method{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;min-width:52px;justify-content:center;text-align:center;flex:none}
.v-api-chip{height:18px;padding:0 6px;font-size:10px}
.v-api-desc{white-space:normal;line-height:1.5}
.v-api-detail{display:flex;flex-direction:column;gap:18px}
.v-api-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.v-api-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.v-api-path{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.v-api-summary{font-size:12.5px;color:var(--text-2);margin-top:5px;max-width:720px;line-height:1.55}
.v-api-actions{margin-left:auto;display:flex;gap:8px;flex:none;flex-wrap:wrap}
.v-api-code{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.v-api-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:20px;align-items:start}
.v-api-section-title{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin:0 0 8px}
.v-api-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.v-api-hint{margin-top:2px}
.v-api-resp-row{display:flex;flex-direction:column;gap:6px}
.v-api-resp-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.v-api-resp-meta .badge{height:18px;font-size:10px}
.v-api-resp-desc{font-size:12px;color:var(--text-2)}
.v-api-meta{display:flex;align-items:center;gap:16px;padding:12px 16px;flex-wrap:wrap}
.v-api-meta .hint{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.v-api-ref{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.v-api-ref-cell{display:flex;align-items:center;gap:10px;min-width:0}
.v-api-ref-cell .icon{color:var(--text-3)}
.v-api-ref-meta{margin-left:auto}
.v-api-copy-src{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.v-api-filter-empty{display:none;padding:10px 16px 12px;font-size:12px;color:var(--text-3)}
.v-api-filter-empty.on{display:block}
.v-api-hide{display:none}
@media (max-width:1560px){.v-api-grid{grid-template-columns:1fr}}
</style>

  /* ---------- rendering ---------- */
  var curEnv = document.documentElement.getAttribute('data-env') || 'local';
  function envKey() { return curEnv === 'prod' ? 'production' : curEnv; }
  function apiBase() {
    var k = envKey();
    if (window.Prism && Prism.envBase && Prism.envBase[k]) return Prism.envBase[k] + '/v1';
    return 'https://api.helix.dev/v1';
  }
  function apiHost() { return apiBase().replace(/\/v1$/, ''); }
  var MCLASS = { GET: 'badge-info', POST: 'badge-success', PATCH: 'badge-warning', DELETE: 'badge-danger' };
  var DETAIL = document.getElementById('v-api-detail');
  var URL_SRC = document.getElementById('v-api-url');
  var SNIP_SRC = document.getElementById('v-api-snippet');
  var cur = 'issues';

  function methodBadge(m) { return '<span class="badge ' + MCLASS[m] + ' v-api-method">' + m + '</span>'; }
  function stabBadge(s) { return '<span class="badge ' + (s === 'beta' ? 'badge-warning' : 'badge-success') + '">' + s + '</span>'; }

  function buildDetail(o) {
    var h = '';
    h += '<div class="v-api-head">' +
      '<div>' +
        '<div class="v-api-title">' + methodBadge(o.m) + '<span class="mono v-api-path">' + o.p + '</span></div>' +
        '<div class="v-api-summary">' + o.d + '</div>' +
      '</div>' +
      '<div class="v-api-actions">' +
        '<button class="btn btn-ghost" data-copy="#v-api-url"><svg class="icon"><use href="#i-copy"/></svg>Copy URL</button>' +
        '<button class="btn btn-ghost" data-copy="#v-api-snippet"><svg class="icon"><use href="#i-code"/></svg>Export snippet</button>' +
      '</div>' +
    '</div>';

    h += '<div class="v-api-grid">';
    h += '<div class="v-api-col">' +
      '<div class="v-api-section-title">Parameters</div>' +
      '<div class="table-wrap"><table class="tbl">' +
        '<thead><tr><th>Param</th><th>In</th><th>Type</th><th>Req</th><th>Description</th></tr></thead>' +
        '<tbody>' + o.params.join('') + '</tbody>' +
      '</table></div>' +
    '</div>';
    h += '<div class="v-api-col">';
    if (o.body) {
      h += '<div><div class="v-api-section-title">Request body · application/json</div>' +
        '<div class="code-block"><div class="code-head"><span class="dots"><i></i><i></i><i></i></span>request.json<span class="hint" style="margin-left:auto">example</span></div>' +
        '<div class="code-body">' + o.body + '</div></div></div>';
    }
    h += '<div><div class="v-api-section-title">Responses</div>' +
      '<div class="v-api-resp-row">' +
        '<div class="v-api-resp-meta">' + (o.resp[0] === 204
          ? '<span class="badge badge-neutral">204 No Content</span>'
          : '<span class="badge badge-success">' + o.resp[1] + '</span>') +
          '<span class="v-api-resp-desc">' + o.resp[2] + '</span></div>' +
        '<div class="code-block"><div class="code-head"><span class="dots"><i></i><i></i><i></i></span>response.json<span class="hint" style="margin-left:auto">schema v3.1</span></div>' +
        '<div class="code-body">' + o.html + '</div></div>' +
      '</div>' +
      '<div class="v-api-hint hint">Errors: ' + o.err + ' — envelope: <span class="mono">{"error":{"code","message"}}</span></div>' +
      (o.list ? '<div class="v-api-hint hint">Cursor-based pagination: pass <span class="mono">page.next_cursor</span> from the previous page as <span class="mono">cursor</span>. Every response carries <span class="mono">X-RateLimit-Remaining</span>.</div>' : '') +
      '<div class="v-api-hint hint" id="v-api-note">Simulated against ' + apiHost() + ' — no network egress.</div>' +
    '</div>';
    h += '</div></div>';

    h += '<div class="card v-api-meta">' +
      '<div><div class="hint">Rate limit</div><div class="strong mono" style="font-size:12px">' + o.rate + '</div></div>' +
      '<div class="divider-v"></div>' +
      '<div><div class="hint">Caching</div><div class="strong mono" style="font-size:12px">' + o.cache + '</div></div>' +
      '<div class="divider-v"></div>' +
      '<div><div class="hint">Stability</div>' + stabBadge(o.s) + '</div>' +
      '<div class="divider-v"></div>' +
      '<div><div class="hint">Auth</div><div class="strong mono" style="font-size:12px">Bearer token</div></div>' +
      '<span style="flex:1"></span>' +
      '<span class="hint">' + o.m + ' <span class="mono">' + o.p + '</span></span>' +
    '</div>';

    h += '<div class="card card-pad v-api-ref">' +
      '<div class="v-api-ref-cell"><svg class="icon"><use href="#i-db"/></svg>' +
        '<div><div class="hint">Backed by table</div>' +
        '<a href="#db?table=' + o.table + '" class="mono strong">' + o.table + '</a><span class="hint"> · ' + o.rows + ' rows</span></div></div>' +
      '<div class="divider-v" style="height:34px"></div>' +
      '<div class="v-api-ref-cell"><svg class="icon"><use href="#i-cube"/></svg>' +
        '<div><div class="hint">Rendered by</div>' +
        '<a href="#design?comp=' + o.comp + '" class="mono strong">' + o.compName + '</a></div></div>' +
      '<div class="v-api-ref-cell v-api-ref-meta"><span class="hint">Sample rows in the database view mirror these response shapes.</span></div>' +
    '</div>';

    return h;
  }

  function render(id) {
    var o = OPS[id];
    DETAIL.innerHTML = buildDetail(o);
    URL_SRC.setAttribute('data-copy-text', apiBase() + o.p);
    SNIP_SRC.setAttribute('data-copy-text',
      "curl -X " + o.m + " '" + apiBase() + o.p + "' \\\n  -H 'Authorization: Bearer helx_live_9f3a…' \\\n  -H 'Accept: application/json'");
  }

  /* ---------- rail filter ---------- */
  var rail = document.getElementById('view-api').querySelector('.rail');
  var items = Array.prototype.slice.call(rail.querySelectorAll('.rail-item'));
  var groupDefs = [];
  var gLabels = rail.querySelectorAll('.rail-group');
  for (var gi = 0; gi < gLabels.length; gi++) {
    var list = [];
    var n = gLabels[gi].nextElementSibling;
    while (n && !n.classList.contains('rail-group')) {
      if (n.classList.contains('rail-item')) list.push(n);
      n = n.nextElementSibling;
    }
    groupDefs.push({ label: gLabels[gi], items: list });
  }
  var searchInput = document.getElementById('v-api-rail-search');
  var emptyEl = document.getElementById('v-api-filter-empty');
  searchInput.addEventListener('input', function () {
    var q = searchInput.value.trim().toLowerCase();
    var total = 0;
    groupDefs.forEach(function (gd) {
      var vis = 0;
      gd.items.forEach(function (it) {
        var match = !q || it.textContent.toLowerCase().indexOf(q) >= 0;
        it.classList.toggle('v-api-hide', !match);
        if (match) vis++;
      });
      gd.label.classList.toggle('v-api-hide', vis === 0);
      total += vis;
    });
    emptyEl.classList.toggle('on', total === 0);
  });

  /* ---------- endpoint switching ---------- */
  function selectOp(id, push) {
    cur = id;
    items.forEach(function (it) {
      it.classList.toggle('active', it.getAttribute('data-op') === id);
    });
    render(id);
    if (push) location.hash = 'api?op=' + id;
  }
  rail.addEventListener('click', function (e) {
    var it = e.target.closest('.rail-item');
    if (!it) return;
    var id = it.getAttribute('data-op');
    if (id && OPS[id] && id !== cur) selectOp(id, true);
  });

  /* ---------- deep link + env sync ---------- */
  window.addEventListener('hashchange', function () {
    if (!document.getElementById('view-api')) return;
    var view = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
    if (view !== 'api') return;
    var op = new URLSearchParams((location.hash.split('?')[1] || '')).get('op');
    if (op && OPS[op] && op !== cur) selectOp(op, false);
  });
  var initOp = new URLSearchParams((location.hash.split('?')[1] || '')).get('op');
  if (!initOp || !OPS[initOp]) initOp = 'issues';
  selectOp(initOp, false);
})();
}
