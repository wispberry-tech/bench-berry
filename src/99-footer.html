<!-- End of view fragments -->
    </main>
  </div>
</div>

<script>
/* ============================================================
   PRISM — shell behaviors (theme, accent, env, router, palette, copy)
   View fragments may add their own <script> blocks; guard them
   with `if (document.getElementById('view-…')) { … }`.
   ============================================================ */
(function () {
  'use strict';

  var $ = function (sel, root) { return (root || document).querySelector(sel); };

  /* ---------- theme ---------- */
  var qs = new URLSearchParams(location.search);
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('prism-theme', t); } catch (e) {}
  }
  var initialTheme = qs.get('theme');
  if (!initialTheme) {
    try { initialTheme = localStorage.getItem('prism-theme'); } catch (e) {}
  }
  if (!initialTheme) {
    initialTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(initialTheme);

  /* ---------- accent ---------- */
  function applyAccent(a) {
    document.documentElement.setAttribute('data-accent', a);
    try { localStorage.setItem('prism-accent', a); } catch (e) {}
  }
  var initialAccent = qs.get('accent');
  if (!initialAccent) { try { initialAccent = localStorage.getItem('prism-accent'); } catch (e) {} }
  applyAccent(initialAccent || 'violet');

  /* ---------- environment ---------- */
  var envBase = { local: 'https://local.helix.dev', staging: 'https://staging.helix.dev', production: 'https://api.helix.dev' };

  /* ---------- router ---------- */
  var VIEWS = ['overview', 'design', 'api', 'db'];
  function currentView() {
    var h = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
    return VIEWS.indexOf(h) >= 0 ? h : 'overview';
  }
  function route() {
    var v = currentView();
    document.querySelectorAll('.view').forEach(function (sec) {
      sec.classList.toggle('active', sec.id === 'view-' + v);
    });
    document.querySelectorAll('[data-nav]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-nav') === v);
    });
    var wsSel = $('#ws-select');
    if (wsSel && wsSel.value !== v) wsSel.value = v;
    window.dispatchEvent(new CustomEvent('prism:view', { detail: { view: v } }));
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-nav]');
    if (!nav) return;
    var id = nav.getAttribute('data-nav');
    if (location.hash === '#' + id) { route(); } else { location.hash = id; }
  });
  route();

  /* ---------- workspace dropdown ---------- */
  var wsSel = document.getElementById('ws-select');
  if (wsSel) {
    wsSel.addEventListener('change', function () {
      location.hash = wsSel.value;
    });
  }

  /* ---------- rail keyboard navigation (Storybook-style) ---------- */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') {
      e.preventDefault();
      openPalette();
      return;
    }
    if (e.key === 'Escape') {
      var ts = document.querySelector('.tb-search input');
      if (document.activeElement === ts) ts.blur();
      return;
    }
    var items = Array.prototype.slice.call(document.querySelectorAll('.view.active .rail .rail-item'));
    if (!items.length) return;
    var idx = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Home' || e.key === 'End') {
      if (idx === -1 && !(tag === 'BODY')) return;
      e.preventDefault();
      var next;
      if (e.key === 'ArrowDown') next = idx === -1 ? 0 : Math.min(idx + 1, items.length - 1);
      else if (e.key === 'ArrowUp') next = idx === -1 ? 0 : Math.max(idx - 1, 0);
      else if (e.key === 'Home') next = 0;
      else next = items.length - 1;
      var el = items[next];
      el.focus();
      el.scrollIntoView({ block: 'nearest' });
    }
  });

  /* ---------- keep active rail item visible on deep links ---------- */
  window.addEventListener('hashchange', function () {
    setTimeout(function () {
      var a = document.querySelector('.view.active .rail .rail-item.active');
      if (a) a.scrollIntoView({ block: 'nearest' });
    }, 60);
  });

  /* ---------- palette ---------- */
  var NAV_ITEMS = [
    { label: 'Overview', icon: 'i-home', hash: 'overview' },
    { label: 'Design System', icon: 'i-cube', hash: 'design' },
    { label: 'API Explorer', icon: 'i-plug', hash: 'api' },
    { label: 'Database', icon: 'i-db', hash: 'db' }
  ];
  function railIcon(b) {
    var use = b.querySelector('use');
    return use ? (use.getAttribute('href') || '').replace(/^#/, '') : 'i-dot-grid';
  }
  function railLabel(b) {
    var c = b.cloneNode(true);
    var n = c.querySelector('.rail-count');
    if (n) n.remove();
    return (c.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function paletteSections() {
    var sections = [{ group: 'Navigate', items: NAV_ITEMS }];
    var design = [], api = [], db = [];
    document.querySelectorAll('#view-design .rail-item[data-ds]').forEach(function (b) {
      design.push({ label: railLabel(b), icon: railIcon(b), hash: 'design?comp=' + b.getAttribute('data-ds') });
    });
    document.querySelectorAll('#view-api .rail-item[data-op]').forEach(function (b) {
      var m = b.querySelector('.v-api-method');
      var p = b.querySelector('.mono');
      api.push({ label: (m ? m.textContent.trim() : '') + ' ' + (p ? p.textContent.trim() : ''), icon: 'i-plug', hash: 'api?op=' + b.getAttribute('data-op') });
    });
    document.querySelectorAll('#view-db .rail-item[data-table]').forEach(function (b) {
      db.push({ label: railLabel(b), icon: railIcon(b), hash: 'db?table=' + b.getAttribute('data-table') });
    });
    if (design.length) sections.push({ group: 'Design System', items: design });
    if (api.length) sections.push({ group: 'API', items: api });
    if (db.length) sections.push({ group: 'Database', items: db });
    return sections;
  }
  function buildPalette(filter) {
    var list = $('.js-palette-list');
    var html = '';
    var f = (filter || '').toLowerCase();
    var count = 0;
    paletteSections().forEach(function (group) {
      var rows = group.items.filter(function (it) {
        return !f || it.label.toLowerCase().indexOf(f) >= 0;
      });
      if (!rows.length) return;
      html += '<div class="menu-label">' + group.group + '</div>';
      rows.forEach(function (it) {
        count++;
        html += '<div class="palette-item" data-hash="' + it.hash + '" tabindex="-1">' +
          '<svg class="icon"><use href="#' + it.icon + '"/></svg>' +
          '<span>' + it.label + '</span>' +
          (it.hint ? '<span class="hint">' + it.hint + '</span>' : '') +
          '</div>';
      });
    });
    list.innerHTML = html || '<div class="palette-empty">No results for “' + filter + '”</div>';
    var first = list.querySelector('.palette-item');
    if (first) first.classList.add('selected');
  }
  function openPalette(prefill) {
    $('.js-palette').classList.add('open');
    var input = $('.js-palette-input');
    input.value = prefill || '';
    buildPalette(input.value);
    input.focus();
  }
  function closePalette() { $('.js-palette').classList.remove('open'); }
  function openPaletteItem() {
    var sel = $('.js-palette-list .palette-item.selected');
    if (!sel) return;
    closePalette();
    location.hash = sel.getAttribute('data-hash');
  }
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if ($('.js-palette').classList.contains('open')) { closePalette(); } else { openPalette(); }
      return;
    }
    if (!$('.js-palette').classList.contains('open')) return;
    if (e.key === 'Escape') { closePalette(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var items = Array.prototype.slice.call(document.querySelectorAll('.js-palette-list .palette-item'));
      var idx = items.findIndex(function (i) { return i.classList.contains('selected'); });
      idx += e.key === 'ArrowDown' ? 1 : -1;
      if (idx < 0) idx = items.length - 1;
      if (idx >= items.length) idx = 0;
      items.forEach(function (i) { i.classList.remove('selected'); });
      items[idx].classList.add('selected');
      items[idx].scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter') { openPaletteItem(); }
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('.palette-item')) {
      var item = e.target.closest('.palette-item');
      closePalette();
      location.hash = item.getAttribute('data-hash');
      return;
    }
    if (e.target.classList.contains('palette-backdrop')) closePalette();
  });
  var paletteInput = $('.js-palette-input');
  if (paletteInput) {
    paletteInput.addEventListener('input', function () { buildPalette(paletteInput.value); });
  }

  /* ---------- topbar search → palette (prefill + live filter) ---------- */
  var tbSearchEl = document.querySelector('.tb-search');
  if (tbSearchEl) {
    var tbInputEl = tbSearchEl.querySelector('input');
    function searchOpenPalette() {
      openPalette(tbInputEl ? tbInputEl.value : '');
    }
    tbSearchEl.addEventListener('click', searchOpenPalette);
    if (tbInputEl) {
      tbInputEl.addEventListener('focus', searchOpenPalette);
      tbInputEl.addEventListener('input', function () {
        if ($('.js-palette').classList.contains('open')) {
          var pin = $('.js-palette-input');
          pin.value = tbInputEl.value;
          buildPalette(pin.value);
        } else {
          searchOpenPalette();
        }
      });
    }
  }

  /* ---------- copy buttons ---------- */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-copy]');
    if (!btn) return;
    var target = btn.getAttribute('data-copy');
    var textEl = target === 'self'
      ? btn
      : document.querySelector(target);
    var text = textEl ? (textEl.getAttribute('data-copy-text') || textEl.textContent.trim()) : '';
    var done = function () {
      var orig = btn.innerHTML;
      btn.innerHTML = '<svg class="icon"><use href="#i-check"/></svg>';
      setTimeout(function () { btn.innerHTML = orig; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta);
      done();
    }
  });

  /* ---------- toast ---------- */
  var toastEl = null, toastTimer = null;
  function toast(text) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'js-toast';
      toastEl.style.cssText =
        'position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(6px);' +
        'background:var(--surface);border:1px solid var(--border-strong);' +
        'border-radius:var(--r-m);box-shadow:var(--shadow-3);color:var(--text);' +
        'font-size:12.5px;padding:9px 16px;z-index:400;opacity:0;pointer-events:none;' +
        'max-width:min(420px,calc(100vw - 32px));transition:opacity .18s,transform .18s';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = text;
    requestAnimationFrame(function () {
      toastEl.style.opacity = '1';
      toastEl.style.transform = 'translateX(-50%) translateY(0)';
    });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.style.opacity = '0';
      toastEl.style.transform = 'translateX(-50%) translateY(6px)';
    }, 2500);
  }

  /* ---------- expose helpers ---------- */
  window.Prism = {
    go: function (view) { location.hash = view; },
    env: function () { return document.documentElement.getAttribute('data-env'); },
    view: currentView,
    openPalette: openPalette,
    toast: toast,
    envBase: envBase
  };
})();
</script>
</body>
</html>
