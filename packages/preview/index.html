<!--
  packages/preview/index.html
  Entry page of the live component preview iframe app (the Canvas, §4.6).
  The shell embeds this page in an <iframe sandbox="allow-scripts"> and the
  story id travels as the `story` query parameter; the app mounts into
  #preview-root (falling back to document.body when absent).
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BerryBench Preview</title>
    <script>
      // Apply the embedding theme before first paint. The boot theme currently
      // rides in main.ts (a deferred module, loaded asynchronously in dev), so
      // a dark-mode embed would otherwise paint the light :root canvas white
      // until the module graph arrives. This classic script runs during parse,
      // ahead of any paint; main.ts re-applies it later (idempotent).
      // Deno check keeps out of this HTML, but keep the guard anyway.
      try {
        var t = new URLSearchParams(location.search).get("theme");
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (err) {}
    </script>
    <link rel="stylesheet" href="./src/theme.css" />
  </head>
  <body>
    <div id="preview-root"></div>
    <!--
      Storage shims must run BEFORE the module graph: the shell embeds this
      page sandboxed (no allow-same-origin), so any localStorage touch in a
      host story module would otherwise abort the whole graph. A classic
      script executes before module evaluation, which import order inside
      main.ts cannot guarantee (vite hoists eager-glob imports to the top).
    -->
    <script src="./src/dom-shims.ts"></script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
